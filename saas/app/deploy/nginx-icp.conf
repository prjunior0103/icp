# =============================================================================
# ICP — Nginx reverse proxy para o subdominio icp.spanlytics.com
# -----------------------------------------------------------------------------
# Encaminha o trafego publico (porta 80/443) para a app ICP, que escuta apenas
# em 127.0.0.1:3003 (publicada pelo docker-compose so no loopback).
#
# Instalacao (na VPS):
#   sudo cp deploy/nginx-icp.conf /etc/nginx/sites-available/icp
#   sudo ln -s /etc/nginx/sites-available/icp /etc/nginx/sites-enabled/icp
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (cadeado): rode o certbot DEPOIS, que injeta o bloco "listen 443" e os
# certificados Let's Encrypt automaticamente:
#   sudo certbot --nginx -d icp.spanlytics.com
# =============================================================================

# Esconde a versao do nginx nos headers/erros.
server_tokens off;

# Suporte a WebSocket: mapeia o header Upgrade para a conexao correta.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name icp.spanlytics.com;

    # Tamanho maximo de upload (relatorios/planilhas). Ajuste se necessario.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;

        # Headers padrao de reverse proxy.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Suporte a WebSocket (HMR / conexoes em tempo real).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts confortaveis para geracao de PDF/PPT/planilhas.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 60s;
    }

    # OBS: o bloco "listen 443 ssl" + certificados sao adicionados pelo certbot.
    # Nao adicione SSL manualmente aqui.
}
